[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-toolkit"
version = "1.0.0"
description = "A Python-based cybersecurity learning toolkit by Rebilraj"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rebilraj" }]
requires-python = ">=3.9"
keywords = ["cybersecurity", "ethical-hacking", "security", "education", "pentest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

dependencies = [
    "scapy>=2.5.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "bcrypt>=4.1.2",
    "cryptography>=42.0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.2.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
]

[project.scripts]
cyber-toolkit = "cli:main"

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["toolkit"]
